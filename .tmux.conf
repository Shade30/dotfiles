# vi keys in copy mode
setw -g mode-keys vi

# pass focus events, required for vim to get FocusGained and autoread file
set -g focus-events on

# copy selection into the system buffer using OSC 52, default external
set -g set-clipboard on

# increase history limit, default 2000
set -g history-limit 50000

# select and resize panels with mouse
set -g mouse on

# 1 is faster to type, default 0
set -g base-index 1
setw -g pane-base-index 1
# no skipped index after window is closed
set -g renumber-windows on

# vi keys in copy mode
setw -g mode-keys vi
# active window title color
setw -g window-status-current-style fg=black,bg=white

# switch panes using hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
